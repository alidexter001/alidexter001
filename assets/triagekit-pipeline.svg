<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">TriageKit security analysis workflow</title>
  <desc id="desc">Four connected stages: inspect source, analyze with static, heuristic and taint analysis, correlate findings and score risk, then prioritize actionable triage.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151b23"/><stop offset="1" stop-color="#0a0d12"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7777"/><stop offset="1" stop-color="#c51f2b"/></linearGradient>
    <pattern id="mesh" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#8994a1" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="22" fill="#080b10"/>
  <rect width="1200" height="300" rx="22" fill="url(#mesh)"/>
  <text x="38" y="43" fill="#ff6666" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="3">TRIAGEKIT // ANALYSIS FLOW</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(36 78)">
      <rect width="250" height="164" rx="14" fill="url(#panel)" stroke="#3a434e"/>
      <rect width="250" height="4" rx="2" fill="url(#accent)"/>
      <circle cx="30" cy="34" r="15" fill="#ff4545" fill-opacity=".14" stroke="#ff4545"/>
      <text x="30" y="39" text-anchor="middle" fill="#ff7777" font-size="13" font-weight="700">01</text>
      <text x="24" y="79" fill="#f1f4f7" font-size="21" font-weight="700">INSPECT</text>
      <text x="24" y="108" fill="#aab4c0" font-size="14">Repository / pull request</text>
      <text x="24" y="131" fill="#76818d" font-size="12">Source · dependencies · target</text>
    </g>
    <g transform="translate(336 78)">
      <rect width="250" height="164" rx="14" fill="url(#panel)" stroke="#3a434e"/>
      <rect width="250" height="4" rx="2" fill="url(#accent)"/>
      <circle cx="30" cy="34" r="15" fill="#ff4545" fill-opacity=".14" stroke="#ff4545"/>
      <text x="30" y="39" text-anchor="middle" fill="#ff7777" font-size="13" font-weight="700">02</text>
      <text x="24" y="79" fill="#f1f4f7" font-size="21" font-weight="700">ANALYZE</text>
      <text x="24" y="108" fill="#aab4c0" font-size="14">Static · heuristic · taint</text>
      <text x="24" y="131" fill="#76818d" font-size="12">OSV dependency intelligence</text>
    </g>
    <g transform="translate(636 78)">
      <rect width="250" height="164" rx="14" fill="url(#panel)" stroke="#3a434e"/>
      <rect width="250" height="4" rx="2" fill="url(#accent)"/>
      <circle cx="30" cy="34" r="15" fill="#ff4545" fill-opacity=".14" stroke="#ff4545"/>
      <text x="30" y="39" text-anchor="middle" fill="#ff7777" font-size="13" font-weight="700">03</text>
      <text x="24" y="79" fill="#f1f4f7" font-size="21" font-weight="700">CORRELATE</text>
      <text x="24" y="108" fill="#aab4c0" font-size="14">Group related findings</text>
      <text x="24" y="131" fill="#76818d" font-size="12">Context · risk scoring</text>
    </g>
    <g transform="translate(936 78)">
      <rect width="228" height="164" rx="14" fill="url(#panel)" stroke="#ff4545" stroke-opacity=".7"/>
      <rect width="228" height="4" rx="2" fill="url(#accent)"/>
      <circle cx="30" cy="34" r="15" fill="#ff4545" fill-opacity=".14" stroke="#ff4545"/>
      <text x="30" y="39" text-anchor="middle" fill="#ff7777" font-size="13" font-weight="700">04</text>
      <text x="24" y="79" fill="#f1f4f7" font-size="21" font-weight="700">PRIORITIZE</text>
      <text x="24" y="108" fill="#aab4c0" font-size="14">Actionable triage</text>
      <text x="24" y="131" fill="#76818d" font-size="12">Developer-ready context</text>
    </g>
  </g>
  <g stroke="#ff4545" stroke-width="2" fill="none" opacity=".9">
    <path d="M291 160H328l-7-6m7 6-7 6"/>
    <path d="M591 160H628l-7-6m7 6-7 6"/>
    <path d="M891 160H928l-7-6m7 6-7 6"/>
  </g>
  <text x="38" y="277" fill="#697581" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="1.5">A PRACTICAL PATH FROM SIGNAL TO DECISION</text>
</svg>
